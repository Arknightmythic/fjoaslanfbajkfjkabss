services:
  postgres-chatbot:
    image: postgres:16-alpine
    container_name: synchrono-chatbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${INTERNAL_USER:-synchrono}
      POSTGRES_PASSWORD: ${INTERNAL_PASSWORD:?Set INTERNAL_PASSWORD in .env}
      POSTGRES_DB: ${INTERNAL_DATABASE:-synchrono_chatbot}
    ports:
      - "127.0.0.1:${INTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_chatbot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - synchrono-network

  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synchrono-chatbot-api
    restart: unless-stopped
    profiles:
      - app
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      INTERNAL_HOST: postgres-chatbot
      INTERNAL_PORT: 5432
    volumes:
      - ./data:/app/data
    depends_on:
      postgres-chatbot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - synchrono-network

networks:
  synchrono-network:
    name: synchrono_network
    driver: bridge

volumes:
  postgres_chatbot_data:
    name: synchrono_chatbot_data

  