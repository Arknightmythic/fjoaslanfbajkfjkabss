# Pod chatbot berjalan sebagai user synchrono (uid/gid 999, dipatok di Dockerfile), jadi tidak butuh
# chown saat start seperti di docker-compose. Setelan dari ConfigMap synchrono-chatbot-config lalu
# Secret synchrono-chatbot-secret (kunci ganda memakai nilai Secret). Pod berlabel
# synchrono.io/chatbot=true adalah satu-satunya yang boleh menghubungi PostgreSQL dan Valkey chatbot.
apiVersion: v1
kind: Service
metadata:
  name: synchrono-chatbot
  labels:
    app.kubernetes.io/name: synchrono-chatbot
spec:
  # Portal di cluster: http://synchrono-chatbot.syncrono.svc:8000. Dari luar: <IP node>:31801.
  type: NodePort
  selector:
    app: synchrono-chatbot-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 31801
---
# /app/data (trace JSONL yang diarsipkan tiap hari) dan cache model fastembed (reranker). Satu PVC
# untuk satu pod API: pengarsip log berjalan di pod yang sama agar bisa membaca trace API.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synchrono-chatbot-data
  labels:
    app.kubernetes.io/name: synchrono-chatbot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synchrono-chatbot-api
  labels:
    app.kubernetes.io/name: synchrono-chatbot
    app.kubernetes.io/component: api
spec:
  replicas: 1
  # PVC ReadWriteOnce: pod lama dilepas dulu sebelum yang baru naik.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: synchrono-chatbot-api
  template:
    metadata:
      labels:
        app: synchrono-chatbot-api
        synchrono.io/chatbot: "true"
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        # alembic upgrade head, seperti layanan `migrate` di docker-compose.
        - name: migrate
          image: synchrono-chatbot
          command: ["/app/.venv/bin/alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: synchrono-chatbot-config
            - secretRef:
                name: synchrono-chatbot-secret
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      containers:
        - name: api
          image: synchrono-chatbot
          command: ["/app/.venv/bin/uvicorn", "src.api.server:app", "--host", "0.0.0.0",
                    "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: synchrono-chatbot-config
            - secretRef:
                name: synchrono-chatbot-secret
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            # Di 107 API memakai ±2,3 GB (model reranker dimuat di proses).
            requests: {cpu: 200m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: data, mountPath: /app/data, subPath: data}
            - {name: data, mountPath: /tmp/fastembed_cache, subPath: fastembed}
        # Pengarsip log harian: worker Celery khusus antrean CHATBOT_LOG_QUEUE, berbagi /app/data
        # dengan API. Celery beat (deployment sendiri) mengirim tugasnya ke antrean itu.
        - name: log-archiver
          image: synchrono-chatbot
          command: ["/app/.venv/bin/celery", "-A", "src.celery_app.celery_app", "worker",
                    "--loglevel=INFO", "--queues=$(CHATBOT_LOG_QUEUE)", "--concurrency=1",
                    "-n", "logs@%h"]
          envFrom:
            - configMapRef:
                name: synchrono-chatbot-config
            - secretRef:
                name: synchrono-chatbot-secret
          resources:
            requests: {cpu: 20m, memory: 192Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /app/data, subPath: data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: synchrono-chatbot-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synchrono-chatbot-worker
  labels:
    app.kubernetes.io/name: synchrono-chatbot
    app.kubernetes.io/component: document-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synchrono-chatbot-worker
  template:
    metadata:
      labels:
        app: synchrono-chatbot-worker
        synchrono.io/chatbot: "true"
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: synchrono-chatbot
          command: ["/app/.venv/bin/celery", "-A", "src.celery_app.celery_app", "worker",
                    "--loglevel=INFO", "--queues=document_ingest", "--concurrency=2",
                    "-n", "documents@%h"]
          envFrom:
            - configMapRef:
                name: synchrono-chatbot-config
            - secretRef:
                name: synchrono-chatbot-secret
          livenessProbe:
            exec:
              command: ["sh", "-c", "/app/.venv/bin/celery -A src.celery_app.celery_app inspect ping --timeout=10 -d documents@$(hostname) | grep -q pong"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: scratch, mountPath: /app/data, subPath: data}
            - {name: scratch, mountPath: /tmp/fastembed_cache, subPath: fastembed}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synchrono-chatbot-beat
  labels:
    app.kubernetes.io/name: synchrono-chatbot
    app.kubernetes.io/component: beat
spec:
  # Tepat satu beat, atau jadwal arsip terkirim dua kali.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: synchrono-chatbot-beat
  template:
    metadata:
      labels:
        app: synchrono-chatbot-beat
        synchrono.io/chatbot: "true"
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: beat
          image: synchrono-chatbot
          command: ["/app/.venv/bin/celery", "-A", "src.celery_app.celery_app", "beat",
                    "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef:
                name: synchrono-chatbot-config
            - secretRef:
                name: synchrono-chatbot-secret
          resources:
            requests: {cpu: 10m, memory: 96Mi}
            limits: {memory: 256Mi}
