# Template Secret untuk Headlamp, tanpa nilai. Salin ke 1-secret.yaml (di-.gitignore) lalu isi,
# atau isi nilai di antara tanda kutip langsung di editor Headlamp. Jangan isi berkas ini:
# berkas ini ada di git. Asal tiap nilai: kube/secret.env.example.
apiVersion: v1
kind: Secret
metadata:
  name: synchrono-chatbot-secret
  namespace: syncrono
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  EMBEDDING_API_KEY: ""
  INTERNAL_PASSWORD: ""
  DB_PASSWORD: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
